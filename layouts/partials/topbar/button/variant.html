{{- /* Variant cycle in the topbar.

     The theme's own switcher is a <select> in the sidebar footer — fine for a
     long variant list, heavy for three. This is one button that steps through
     dark -> light -> cyber -> dark. Its icon shows the variant you are IN;
     the tooltip says where tapping takes you.

     The `icon` below is what renders server-side, before any script runs.
     Since the icon is now state, the honest placeholder is the icon of the
     DEFAULT variant — a first-time visitor lands in `hacker` and sees the
     moon it will keep. A returning visitor on another variant gets one
     frame of moon before custom.js repaints.

     The `hint` is likewise a static fallback. The script overwrites title and
     aria-label with the specific destination ("Switch to cyber"), so this
     string is only ever read with JavaScript off.

     No href here on purpose: the theme renders topbar buttons as <button>,
     so a `javascript:` URL would never fire. assets/js/custom.js binds the
     click and calls window.relearn.changeVariant(), the theme's public API —
     that writes localStorage and fires themeVariantLoaded, which mermaid and
     the OpenAPI embeds need in order to re-render in the new palette. */ -}}
{{- partial "topbar/func/button.html" (dict
  "page" .page
  "class" "topbar-button-variant wf-variant-toggle"
  "icon" "moon"
  "onempty" "show"
  "hint" "Switch colour scheme: dark, light, cyber"
)}}
